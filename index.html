<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vibe Apps</title>
  <meta name="description" content="Minimal, visual apps by an indie developer.">

  <!-- OpenGraph -->
  <meta property="og:title" content="Vibe Apps">
  <meta property="og:description" content="Minimal apps. Visual mindset.">
  <meta property="og:type" content="website">

  <!-- Favicon: purple dot -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='40' fill='%237c5cbf'/></svg>">

  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>

    <!-- ===== HERO ===== -->
    <section class="hero" aria-labelledby="hero-heading">
      <div class="container">
        <h1 id="hero-heading" class="hero__title">Vibe Apps</h1>
        <p class="hero__subtitle">Minimal apps. Visual mindset.</p>
      </div>
    </section>

    <!-- ===== UPCOMING APPS ===== -->
    <section class="upcoming" aria-labelledby="upcoming-heading">
      <div class="container">
        <h2 id="upcoming-heading" class="section-heading">Upcoming</h2>

        <div class="cards-grid" role="list">

          <!-- 365 Vibe Days -->
          <article class="card" role="listitem">
            <div class="card__icon" aria-hidden="true">
              <svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="9" cy="9" r="3" fill="currentColor" opacity="0.3"/>
                <circle cx="19" cy="9" r="3" fill="currentColor" opacity="0.5"/>
                <circle cx="29" cy="9" r="3" fill="currentColor" opacity="0.7"/>
                <circle cx="39" cy="9" r="3" fill="currentColor" opacity="1"/>
                <circle cx="9" cy="19" r="3" fill="currentColor" opacity="0.4"/>
                <circle cx="19" cy="19" r="3" fill="currentColor" opacity="0.6"/>
                <circle cx="29" cy="19" r="3" fill="currentColor" opacity="0.8"/>
                <circle cx="39" cy="19" r="3" fill="currentColor" opacity="1"/>
                <circle cx="9" cy="29" r="3" fill="currentColor" opacity="0.5"/>
                <circle cx="19" cy="29" r="3" fill="currentColor" opacity="0.7"/>
                <circle cx="29" cy="29" r="3" fill="currentColor" opacity="0.9"/>
                <circle cx="39" cy="29" r="3" fill="currentColor" opacity="0.3"/>
                <circle cx="9" cy="39" r="3" fill="currentColor" opacity="0.6"/>
                <circle cx="19" cy="39" r="3" fill="currentColor" opacity="0.2"/>
                <circle cx="29" cy="39" r="3" fill="currentColor" opacity="0.4"/>
                <circle cx="39" cy="39" r="3" fill="currentColor" opacity="0.5"/>
              </svg>
            </div>
            <h3 class="card__name">365 Vibe Days</h3>
            <p class="card__desc">Visualize time with dot grids.</p>
          </article>

          <!-- VibeFlip -->
          <article class="card" role="listitem">
            <div class="card__icon" aria-hidden="true">
              <svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect x="6" y="10" width="26" height="32" rx="4" stroke="currentColor" stroke-width="2" opacity="0.4"/>
                <rect x="16" y="6" width="26" height="32" rx="4" fill="currentColor" opacity="0.15" stroke="currentColor" stroke-width="2"/>
              </svg>
            </div>
            <h3 class="card__name">VibeFlip</h3>
            <p class="card__desc">Daily quotes &amp; reflection.</p>
          </article>

        </div>

        <p class="upcoming__more">More Vibe apps soon.</p>
      </div>
    </section>

  </main>

  <footer class="footer">
    <div class="container">
      <p>&copy; 2026 Vibe Apps &middot; <a href="privacy.html">Privacy</a></p>
    </div>
  </footer>

  <script src="script.js" defer></script>
</body>
</html>
